name: publish

# Releasing = merging a PR that bumps "version" in package.json.
# If that version isn't on npm yet, publish it (npm trusted publishing via OIDC, no token),
# then tag it and create a GitHub release.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag + GitHub release
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # ships npm 11, which trusted publishing needs
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Read version
        id: pkg
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already on npm, skipping publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci
        if: steps.pkg.outputs.published == 'false'

      # prepublishOnly runs typecheck, tests and build first.
      - name: Publish to npm
        if: steps.pkg.outputs.published == 'false'
        run: npm publish --access public --provenance

      - name: Tag and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.pkg.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
